# ===== Server =====
server.port=${PORT:8080}

# Comma-separated browser origins allowed to call the API (no trailing slash).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://cyber-trace-frontend-alpha.vercel.app}

# Optional one-time administrator bootstrap. Store real values as Railway secrets.
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ===== MySQL =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/cybertrace_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000

# ===== File Upload =====
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===== Logging =====
logging.level.org.springframework.security=INFO
